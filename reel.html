<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Creative coding</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #080b10;
      }
      canvas {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(100vw, 56.25dvh);
        height: min(100dvh, 177.7777778vw);
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas
      width="1080"
      height="1920"
      aria-label="Code and generative painting"
    ></canvas>
    <script type="module" src="/src/reel.js"></script>
